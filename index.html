<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anxious Antic - Offline Edition</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <div id="crt-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <!-- Inner Monologue Overlay -->
        <div id="monologue-box">...</div>

        <div id="ui-layer">
            <div class="hud-bar">
                <span id="level-display" class="hud-text">LEVEL 1</span>
                <span id="timer-display" class="hud-text anxiety-meter">BATTERY: 100%</span>
            </div>
            
            <div id="center-message">
                <h1 id="title-text">ANXIOUS ANTIC</h1>
                <p id="desc-text" style="font-size: 20px; line-height: 1.4;">
                    Meet <strong>Alex</strong>. He suffers from severe social anxiety.<br>
                    To him, a simple "Hello" is a boss battle.<br>
                    <br>
                    Tap the <span style="color:#ef4444"> THREATS</span> to avoid awkward eye contact.<br>
                    Don't let your social battery run out!
                </p>
                <div id="button-container">
                    <button id="start-btn" onclick="startGame()">START GAME</button>
                </div>
            </div>
        </div>
    </div>

<script src="script.js" defer></script>
</body>
</html>
